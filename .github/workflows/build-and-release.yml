name: Build and publish skill-toggle binaries

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "opencode version tag to build (default: latest)"
        required: false
        default: "latest"
      force:
        description: "Force rebuild even if the version was already published"
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "30 4 * * *"
  push:
    branches: [main]
    # The installers and the guard are published as release assets: a change in
    # any of them must rebuild and republish, or users would keep downloading
    # the old ones.
    paths:
      - "patches/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - "build.sh"
      - ".github/workflows/build-and-release.yml"

permissions:
  contents: write
  issues: write

# Serialize runs: the installers/guard resolve the newest toggle-* tag, so a
# second concurrent build could publish a tag that is no longer the one the
# smoke test validated.
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      published: ${{ steps.resolve.outputs.published }}
      build_tag: ${{ steps.resolve.outputs.build_tag }}
      download_tag: ${{ steps.resolve.outputs.download_tag }}
      patch_sha: ${{ steps.resolve.outputs.patch_sha }}
      need_build: ${{ steps.resolve.outputs.need_build }}
    steps:
      - name: Checkout repo (for patches)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.upstream_version }}" != "" ] && [ "${{ inputs.upstream_version }}" != "latest" ]; then
            V="${{ inputs.upstream_version }}"
          else
            V="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          PUBLISHED="$(gh release view "toggle-$V" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo '')"
          # The installers/guard resolve the NEWEST toggle-* tag, so that is where
          # the smoke test and the scripts must point when no build runs.
          NEWEST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("toggle-"))][0].tagName' 2>/dev/null || true)"
          # Newest release for THIS upstream version (toggle-V or a rebuild
          # toggle-V-rN). Its PATCH_SHA256 tells whether the binary is current.
          VERSION_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq "[.[] | select(.tagName == \"toggle-$V\" or (.tagName | startswith(\"toggle-$V-\")))][0].tagName" 2>/dev/null || true)"
          # A different patch set means the published binary is stale even when
          # the version is already there: rebuild without waiting for a new
          # upstream release.
          PATCH_SHA="$(cat patches/*.patch | sha256sum | awk '{print $1}')"
          REMOTE_PATCH_SHA="$(gh release download "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern PATCH_SHA256 --output - 2>/dev/null || true)"
          NEED_BUILD=0
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ -z "$PUBLISHED" ] || [ "$PATCH_SHA" != "$REMOTE_PATCH_SHA" ]; then
            NEED_BUILD=1
          fi
          # Each build goes to a UNIQUE TAG: a new version is published to
          # toggle-$V; a rebuild to toggle-$V-r<run>. Thus the content of every
          # release never changes, avoiding mixed old/new binaries in the CDN
          # cache (the problem with overwriting "latest" or "toggle-$V" with
          # --clobber).
          if [ "$NEED_BUILD" = "1" ] && [ -n "$PUBLISHED" ]; then
            BUILD_TAG="toggle-${V}-r${{ github.run_number }}"
          else
            BUILD_TAG="toggle-$V"
          fi
          # Where smoke tests must download from: if build runs it validates the
          # freshly built binaries (BUILD_TAG); if build is skipped (already
          # published with the same patches) it validates the existing release.
          if [ "$NEED_BUILD" = "1" ]; then
            DOWNLOAD_TAG="$BUILD_TAG"
          else
            DOWNLOAD_TAG="${NEWEST_TAG:-toggle-$V}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "download_tag=$DOWNLOAD_TAG" >> "$GITHUB_OUTPUT"
          echo "patch_sha=$PATCH_SHA" >> "$GITHUB_OUTPUT"
          echo "need_build=$NEED_BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.need_build == '1' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.detect.outputs.version }}
      BUILD_TAG: ${{ needs.detect.outputs.build_tag }}
      PATCH_SHA: ${{ needs.detect.outputs.patch_sha }}
    steps:
      - name: Checkout repo (for patches)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Clone opencode at target version
        run: |
          git clone --depth 1 --branch "${{ needs.detect.outputs.tag }}" \
            https://github.com/anomalyco/opencode.git /tmp/opencode-src

      - name: Apply patches
        run: |
          cd /tmp/opencode-src
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo ">> Applying $p"
            if ! git apply --3way "$p"; then
              TITLE="Patches need update for ${{ needs.detect.outputs.tag }}"
              EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --search "\"$TITLE\" in:title" --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
              BODY="\`git apply --3way\` failed for \`$p\` on opencode \`${{ needs.detect.outputs.tag }}\`. Update the patch or adapt it. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              if [ -n "$EXISTING" ]; then
                gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
              fi
              echo "::error::patch apply failed for $p on ${{ needs.detect.outputs.tag }}"
              exit 1
            fi
          done

      - name: Install dependencies
        working-directory: /tmp/opencode-src
        run: bun install --frozen-lockfile

      - name: Build opencode (cross-compile all targets)
        working-directory: /tmp/opencode-src/packages/opencode
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ needs.detect.outputs.version }}
          SPLIT: "0"
        run: bun run build --skip-embed-web-ui

      - name: Publish versioned release on a unique tag (+ SHA256SUMS + scripts)
        run: |
          # The binaries we publish (the build produces 12 variants; we pick the usual ones)
          PLATFORMS="linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl linux-x64-baseline darwin-x64 darwin-arm64 windows-x64"
          DEST="$RUNNER_TEMP/versioned"
          mkdir -p "$DEST"
          cd /tmp/opencode-src/packages/opencode/dist
          ASSETS=()
          for PLATFORM in $PLATFORMS; do
            BIN="$(find "opencode-$PLATFORM/bin" -maxdepth 1 -type f \( -name 'opencode' -o -name 'opencode.exe' \) -print -quit)"
            if [ -z "$BIN" ]; then
              echo "::error::no binary found for $PLATFORM"
              exit 1
            fi
            ASSET="opencode-${VERSION}-toggle-${PLATFORM}"
            cp "$BIN" "$DEST/$ASSET"
            ASSETS+=("$DEST/$ASSET")
            # On top of the versioned name, the same binaries under the plain
            # name (like in "latest") as an aesthetic fallback.
            cp "$BIN" "$DEST/opencode-${PLATFORM}"
            ASSETS+=("$DEST/opencode-${PLATFORM}")
          done
          cd "$DEST"
          sha256sum opencode-* > SHA256SUMS
          ASSETS+=("$DEST/SHA256SUMS")
          printf '%s\n' "$PATCH_SHA" > "$DEST/PATCH_SHA256"
          ASSETS+=("$DEST/PATCH_SHA256")
          if gh release view "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release upload "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --clobber
          else
            gh release create "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" \
              --title "opencode $VERSION + skill-toggle ($BUILD_TAG)" \
              --notes "Custom build of opencode **$VERSION** with the persistent skill toggle.

              Unique **build release** (never overwritten): the installer and the guard resolve tag **$BUILD_TAG** (or the most recent \`toggle-*\`) via the API so the correct binary is always downloaded.

              Install: \`curl -sL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | bash\` (Linux/macOS) or \`irm .../install.ps1 | iex\` (Windows). Verify the SHA256 of your binary against SHA256SUMS."
          fi

      - name: Publish rolling "latest" assets (+ SHA256SUMS)
        run: |
          PLATFORMS="linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl linux-x64-baseline darwin-x64 darwin-arm64 windows-x64"
          DEST="$RUNNER_TEMP/latest"
          mkdir -p "$DEST"
          cd /tmp/opencode-src/packages/opencode/dist
          ASSETS=()
          for PLATFORM in $PLATFORMS; do
            BIN="$(find "opencode-$PLATFORM/bin" -maxdepth 1 -type f \( -name 'opencode' -o -name 'opencode.exe' \) -print -quit)"
            if [ -z "$BIN" ]; then
              echo "::error::no binary found for $PLATFORM"
              exit 1
            fi
            ASSET="opencode-${PLATFORM}"
            cp "$BIN" "$DEST/$ASSET"
            ASSETS+=("$DEST/$ASSET")
          done
          cd "$DEST"
          sha256sum opencode-* > SHA256SUMS
          ASSETS+=("$DEST/SHA256SUMS")
          if gh release view latest --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release upload latest --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --clobber
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --title "latest" \
              --notes "Binaries of the latest version compiled with skill-toggle. Download \`opencode-<platform>\` and verify against SHA256SUMS."
          fi

  # Scripts are published independently of the binary build: a change to
  # install.sh/scripts/** must reach users even when the version was already
  # built (build skipped). They go to the release the installers resolve
  # (download_tag) and to "latest" for the one-line install commands.
  publish-scripts:
    needs: [detect, build]
    if: ${{ always() && needs.detect.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checksum the scripts
        run: |
          cd "$GITHUB_WORKSPACE/scripts"
          sha256sum toggle-guard.sh toggle-guard.ps1 toggle-cleanup.sh toggle-cleanup.ps1 \
            toggle-uninstall.sh toggle-uninstall.ps1 \
            > "$RUNNER_TEMP/SHA256SUMS.scripts"

      - name: Publish installers and guards
        env:
          TAG: ${{ needs.detect.outputs.download_tag }}
        run: |
          FILES=()
          for f in install.sh install.ps1 scripts/toggle-guard.sh scripts/toggle-guard.ps1 \
                   scripts/toggle-cleanup.sh scripts/toggle-cleanup.ps1 \
                   scripts/toggle-uninstall.sh scripts/toggle-uninstall.ps1; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              FILES+=("$GITHUB_WORKSPACE/$f")
            else
              echo "::error::$f is missing"
              exit 1
            fi
          done
          FILES+=("$RUNNER_TEMP/SHA256SUMS.scripts")
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist; cannot publish scripts"
            exit 1
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${FILES[@]}" --clobber
          if gh release view latest --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release upload latest --repo "$GITHUB_REPOSITORY" "${FILES[@]}" --clobber
          fi

      - name: Close stale patch issues after a successful build
        if: ${{ needs.build.result == 'success' || needs.build.result == 'skipped' }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Patches need update" in:title' --json number,title \
            --jq '.[] | select(.title | startswith("Patches need update")) | .number' |
          while read -r n; do
            [ -n "$n" ] || continue
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Fixed: the patches apply again on opencode ${{ needs.detect.outputs.tag }}."
          done

  smoke:
    name: Smoke ${{ matrix.platform }}
    needs: [detect, build]
    if: ${{ always() && needs.detect.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: windows-x64
    env:
      PLATFORM: ${{ matrix.platform }}
      DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.detect.outputs.download_tag }}
      EXPECTED_VERSION: ${{ needs.detect.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Smoke test for the toggle (skill status/enable/disable + persistence)
        run: bash "$GITHUB_WORKSPACE/scripts/smoke-test.sh"

      - name: Installer is idempotent (no re-download when already current)
        if: ${{ matrix.platform != 'windows-x64' }}
        run: |
          # Use a throwaway HOME and a dummy local binary so this checks the
          # "already up to date" path without downloading hundreds of MB again.
          T="$(mktemp -d)"
          H="$(mktemp -d)"
          cp install.sh "$T/"
          mkdir -p "$T/dist"
          printf '#!/bin/sh\necho fake-opencode\n' > "$T/dist/opencode-$PLATFORM"
          chmod +x "$T/dist/opencode-$PLATFORM"
          HOME="$H" TOGGLE_GUARD=0 TOGGLE_USE_LOCAL=1 bash "$T/install.sh" >/dev/null
          OUT="$(HOME="$H" TOGGLE_GUARD=0 TOGGLE_USE_LOCAL=1 bash "$T/install.sh" 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -q "Already up to date" || {
            echo "::error::installer did not detect the up-to-date binary"
            exit 1
          }
