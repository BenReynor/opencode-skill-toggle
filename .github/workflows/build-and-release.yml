name: Build and publish skill-toggle binaries

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "opencode version tag to build (default: latest)"
        required: false
        default: "latest"
      force:
        description: "Force rebuild even if the version was already published"
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "30 4 * * *"
  push:
    branches: [main]
    paths: ["patches/**", ".github/workflows/build-and-release.yml"]

permissions:
  contents: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      published: ${{ steps.resolve.outputs.published }}
      build_tag: ${{ steps.resolve.outputs.build_tag }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.upstream_version }}" != "" ] && [ "${{ inputs.upstream_version }}" != "latest" ]; then
            V="${{ inputs.upstream_version }}"
          else
            V="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          PUBLISHED="$(gh release view "toggle-$V" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo '')"
          # Cada build va a un TAG ÚNICO: si es versión nueva se publica en
          # toggle-$V; si es rebuild forzado, en toggle-$V-r<run>. Así el
          # contenido de cada release nunca cambia y se evita mezclar bins
          # viejos/nuevos en la caché del CDN (problema de sobrescribir
          # "latest" o "toggle-$V" con --clobber).
          if [ -n "$PUBLISHED" ]; then
            BUILD_TAG="toggle-${V}-r${{ github.run_number }}"
          else
            BUILD_TAG="toggle-$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ (github.event.inputs.force == 'true') || (needs.detect.outputs.published == '') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.detect.outputs.version }}
      BUILD_TAG: ${{ needs.detect.outputs.build_tag }}
    steps:
      - name: Checkout repo (for patches)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Clone opencode at target version
        run: |
          git clone --depth 1 --branch "${{ needs.detect.outputs.tag }}" \
            https://github.com/anomalyco/opencode.git /tmp/opencode-src

      - name: Apply patches
        run: |
          cd /tmp/opencode-src
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo ">> Applying $p"
            if ! git apply --3way "$p"; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "Patches need update for ${{ needs.detect.outputs.tag }}" \
                --body "git apply --3way failed for \`$p\` on opencode \`${{ needs.detect.outputs.tag }}\`. Update the patch or adapt it."
              echo "::error::patch apply failed for $p on ${{ needs.detect.outputs.tag }}"
              exit 1
            fi
          done

      - name: Install dependencies
        working-directory: /tmp/opencode-src
        run: bun install --frozen-lockfile

      - name: Build opencode (cross-compile all targets)
        working-directory: /tmp/opencode-src/packages/opencode
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ needs.detect.outputs.version }}
          SPLIT: "0"
        run: bun run build --skip-embed-web-ui

      - name: Publish versioned release en tag único (+ SHA256SUMS + scripts)
        run: |
          # Binarios que publicamos (el build produce 12 variantes; elegimos las habituales)
          PLATFORMS="linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl linux-x64-baseline darwin-x64 darwin-arm64 windows-x64"
          DEST="$RUNNER_TEMP/versioned"
          mkdir -p "$DEST"
          cd /tmp/opencode-src/packages/opencode/dist
          ASSETS=()
          for PLATFORM in $PLATFORMS; do
            BIN="$(find "opencode-$PLATFORM/bin" -maxdepth 1 -type f \( -name 'opencode' -o -name 'opencode.exe' \) | head -1)"
            if [ -z "$BIN" ]; then
              echo "::error::no binary found for $PLATFORM"
              exit 1
            fi
            ASSET="opencode-${VERSION}-toggle-${PLATFORM}"
            cp "$BIN" "$DEST/$ASSET"
            ASSETS+=("$DEST/$ASSET")
            # Además del nombre versionado, los mismos binarios con el nombre
            # plano (como en "latest") para que sirvan de respaldo por estética.
            cp "$BIN" "$DEST/opencode-${PLATFORM}"
            ASSETS+=("$DEST/opencode-${PLATFORM}")
          done
          cd "$DEST"
          sha256sum opencode-* > SHA256SUMS
          ASSETS+=("$DEST/SHA256SUMS")
          for f in "$GITHUB_WORKSPACE/install.sh" "$GITHUB_WORKSPACE/install.ps1" \
                   "$GITHUB_WORKSPACE/scripts/toggle-guard.sh" "$GITHUB_WORKSPACE/scripts/toggle-guard.ps1" \
                   "$GITHUB_WORKSPACE/scripts/toggle-cleanup.sh" "$GITHUB_WORKSPACE/scripts/toggle-cleanup.ps1"; do
            if [ -f "$f" ]; then
              ASSETS+=("$f")
            else
              echo ">> aviso: $f no existe, se omite"
            fi
          done
          if gh release view "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release upload "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --clobber
          else
            gh release create "$BUILD_TAG" --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" \
              --title "opencode $VERSION + skill-toggle ($BUILD_TAG)" \
              --notes "Build custom de opencode **$VERSION** con el toggle de skills persistente.

Release de build **único** (nunca se sobrescribe): el instalador y el guardián resuelven el tag **$BUILD_TAG** (o el más reciente \`toggle-*\`) por la API para descargar siempre el binario correcto.

Instalar: \`curl -sL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | bash\` (Linux/macOS) o \`irm .../install.ps1 | iex\` (Windows). Verifica el SHA256 de tu binario con SHA256SUMS."
          fi

      - name: Publish rolling "latest" assets (+ SHA256SUMS)
        run: |
          PLATFORMS="linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl linux-x64-baseline darwin-x64 darwin-arm64 windows-x64"
          DEST="$RUNNER_TEMP/latest"
          mkdir -p "$DEST"
          cd /tmp/opencode-src/packages/opencode/dist
          ASSETS=()
          for PLATFORM in $PLATFORMS; do
            BIN="$(find "opencode-$PLATFORM/bin" -maxdepth 1 -type f \( -name 'opencode' -o -name 'opencode.exe' \) | head -1)"
            if [ -z "$BIN" ]; then
              echo "::error::no binary found for $PLATFORM"
              exit 1
            fi
            ASSET="opencode-${PLATFORM}"
            cp "$BIN" "$DEST/$ASSET"
            ASSETS+=("$DEST/$ASSET")
          done
          cd "$DEST"
          sha256sum opencode-* > SHA256SUMS
          ASSETS+=("$DEST/SHA256SUMS")
          if gh release view latest --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release upload latest --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --clobber
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}" --title "latest" \
              --notes "Binarios de la última versión compilada con skill-toggle. Descarga \`opencode-<platform>\` y verifica con SHA256SUMS."
          fi

      - name: Copiar installers y guardianes al release latest
        run: |
          FILES=()
          for f in install.sh install.ps1 scripts/toggle-guard.sh scripts/toggle-guard.ps1 scripts/toggle-cleanup.sh scripts/toggle-cleanup.ps1; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              FILES+=("$GITHUB_WORKSPACE/$f")
            else
              echo ">> aviso: $f no existe en el repo, se omite"
            fi
          done
          if gh release view latest --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release upload latest --repo "$GITHUB_REPOSITORY" "${FILES[@]}" --clobber
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" "${FILES[@]}" --title "latest" --notes "instalador"
          fi

  smoke:
    name: Smoke ${{ matrix.platform }}
    needs: [detect, build]
    if: ${{ always() && needs.detect.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: windows-x64
    env:
      PLATFORM: ${{ matrix.platform }}
      DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.detect.outputs.build_tag }}
      EXPECTED_VERSION: ${{ needs.detect.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Smoke test del toggle (skill status/enable/disable + persistencia)
        run: bash "$GITHUB_WORKSPACE/scripts/smoke-test.sh"