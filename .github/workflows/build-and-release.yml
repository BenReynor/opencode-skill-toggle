name: Build and publish skill-toggle binaries

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "opencode version tag to build (default: latest)"
        required: false
        default: "latest"
      force:
        description: "Force rebuild even if the version was already published"
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "30 4 * * *"
  push:
    branches: [main]
    paths: ["patches/**", ".github/workflows/build-and-release.yml"]

permissions:
  contents: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      published: ${{ steps.resolve.outputs.published }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.upstream_version }}" != "" ] && [ "${{ inputs.upstream_version }}" != "latest" ]; then
            V="${{ inputs.upstream_version }}"
          else
            V="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          PUBLISHED="$(gh release view "toggle-$V" --json tagName --jq .tagName 2>/dev/null || echo '')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ (github.event.inputs.force == 'true') || (needs.detect.outputs.published == '') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - name: Checkout repo (for patches)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          version: latest

      - name: Clone opencode at target version
        run: |
          git clone --depth 1 --branch "${{ needs.detect.outputs.tag }}" \
            https://github.com/anomalyco/opencode.git /tmp/opencode-src

      - name: Apply patches
        run: |
          cd /tmp/opencode-src
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo ">> Applying $p"
            if ! git apply --3way "$p"; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "Patches need update for ${{ needs.detect.outputs.tag }}" \
                --body "git apply --3way failed for \`$p\` on opencode \`${{ needs.detect.outputs.tag }}\`. Update the patch or adapt it."
              echo "::error::patch apply failed for $p on ${{ needs.detect.outputs.tag }}"
              exit 1
            fi
          done

      - name: Install dependencies
        working-directory: /tmp/opencode-src
        run: bun install --frozen-lockfile

      - name: Build opencode (cross-compile all targets)
        working-directory: /tmp/opencode-src/packages/opencode
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ needs.detect.outputs.version }}
          SPLIT: "0"
        run: bun run build --skip-embed-web-ui

      - name: Publish versioned release
        run: |
          # Binarios que publicamos (el build produce 12 variantes; elegimos las habituales)
          PLATFORMS="linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl linux-x64-baseline darwin-x64 darwin-arm64 windows-x64"
          cd /tmp/opencode-src/packages/opencode/dist
          ASSETS=()
          for PLATFORM in $PLATFORMS; do
            BIN="$(find "$PLATFORM/bin" -maxdepth 1 -type f \( -name 'opencode' -o -name 'opencode.exe' \) | head -1)"
            if [ -z "$BIN" ]; then
              echo "::error::no binary found for $PLATFORM"
              exit 1
            fi
            ASSET="opencode-${VERSION}-toggle-${PLATFORM}"
            cp "$BIN" "$RUNNER_TEMP/$ASSET"
            ASSETS+=("$RUNNER_TEMP/$ASSET")
          done
          if gh release view "toggle-$VERSION" --json tagName >/dev/null 2>&1; then
            gh release upload "toggle-$VERSION" "${ASSETS[@]}" --clobber
          else
            gh release create "toggle-$VERSION" "${ASSETS[@]}" \
              --title "opencode $VERSION + skill-toggle" \
              --notes "Build custom de opencode **$VERSION** con el toggle de skills persistente.

              Instalar: \`curl -sL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | bash\` (Linux/macOS) o \`irm .../install.ps1 | iex\` (Windows)."
          fi

      - name: Publish rolling "latest" assets
        run: |
          PLATFORMS="linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl linux-x64-baseline darwin-x64 darwin-arm64 windows-x64"
          cd /tmp/opencode-src/packages/opencode/dist
          ASSETS=()
          for PLATFORM in $PLATFORMS; do
            BIN="$(find "$PLATFORM/bin" -maxdepth 1 -type f \( -name 'opencode' -o -name 'opencode.exe' \) | head -1)"
            if [ -z "$BIN" ]; then
              echo "::error::no binary found for $PLATFORM"
              exit 1
            fi
            ASSET="opencode-${PLATFORM}"
            cp "$BIN" "$RUNNER_TEMP/$ASSET"
            ASSETS+=("$RUNNER_TEMP/$ASSET")
          done
          gh release upload latest "${ASSETS[@]}" --clobber || \
            gh release create latest "${ASSETS[@]}" --title "latest" \
              --notes "Binarios de la última versión compilada con skill-toggle. Descarga \`opencode-<platform>\`."

      - name: Copiar installers al release latest
        run: |
          FILES=()
          for f in install.sh install.ps1; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              FILES+=("$GITHUB_WORKSPACE/$f")
            else
              echo ">> aviso: $f no existe en el repo, se omite"
            fi
          done
          if gh release view latest --json tagName >/dev/null 2>&1; then
            gh release upload latest "${FILES[@]}" --clobber
          else
            gh release create latest "${FILES[@]}" --title "latest" --notes "instalador"
          fi